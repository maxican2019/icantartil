name: Build APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.2
      - name: Unit test + build debug APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
        env:
          PROXY_BASE_URL: ${{ secrets.PROXY_BASE_URL }}
          APP_KEY: ${{ secrets.APP_KEY }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: IcanTartil-debug-apk
          path: app/build/outputs/apk/debug/*.apk
