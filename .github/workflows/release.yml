name: Release AAB (Play Store)
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Nama versi, mis. 1.0.0"
        required: true
        default: "1.0.0"
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unduh bundel data Al-Qur'an (fallback offline di APK)
        run: python3 tools/fetch_bundle.py
        continue-on-error: true
      - name: Siapkan keystore upload
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::Secret KEYSTORE_BASE64 belum diisi (lihat docs/PUBLISH.md langkah 2)"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.2
      - name: Uji unit, bangun AAB dan APK rilis
        run: gradle testDebugUnitTest bundleRelease assembleRelease --no-daemon --stacktrace
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version_name }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
      - name: Periksa kesiapan 16 KB page size
        run: python3 tools/check_16kb.py app/build/outputs/apk/release/*.apk
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: IcanTartil-release-${{ inputs.version_name }}-${{ github.run_number }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
